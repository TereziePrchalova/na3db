services:
  db:
    image: postgres:16
    container_name: na3db-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: na3db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d na3db"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: na3db-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: na3db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      NODE_ENV: production
    command: npm run start

volumes:
  postgres_data: